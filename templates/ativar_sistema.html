<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ativar Sistema</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Ativar Sistema</h1>

    <p>
        Digite a chave Master para ativar esta instalação.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <label for="chave">
            Chave de ativação
        </label>

        <input
            type="password"
            id="chave"
            name="chave"
            required
            autocomplete="off"
        >

        <button type="submit">
            Ativar Sistema
        </button>

    </form>

</div>

</body>

</html>
